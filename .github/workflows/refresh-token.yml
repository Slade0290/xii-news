name: Renouveler le jeton Instagram

# Le jeton Instagram dure 60 jours. Ce robot le prolonge chaque lundi.
# Si le secret SECRETS_PAT existe (jeton GitHub avec le droit d'écrire les secrets du dépôt),
# il enregistre aussi le nouveau jeton dans IG_ACCESS_TOKEN.
on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Prolonger le jeton
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}
        run: |
          [ -n "$IG_ACCESS_TOKEN" ] || { echo "::warning::Aucun jeton IG_ACCESS_TOKEN configuré."; exit 0; }
          R=$(curl -sS "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=$IG_ACCESS_TOKEN")
          NEW=$(echo "$R" | jq -r '.access_token // empty')
          if [ -z "$NEW" ]; then
            echo "::error::Renouvellement refusé : $(echo "$R" | jq -c '.error // .')"
            echo "Génère un nouveau jeton dans Meta for Developers et colle-le dans le secret IG_ACCESS_TOKEN."
            exit 1
          fi
          echo "::add-mask::$NEW"
          DAYS=$(( $(echo "$R" | jq -r '.expires_in') / 86400 ))
          echo "Jeton prolongé : valable encore $DAYS jours."
          if [ -n "$GH_TOKEN" ] && [ "$NEW" != "$IG_ACCESS_TOKEN" ]; then
            gh secret set IG_ACCESS_TOKEN --body "$NEW" -R "${{ github.repository }}"
            echo "Nouveau jeton enregistré dans IG_ACCESS_TOKEN."
          fi
